name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Kita pakai Java 21 agar Fabric Loom tidak protes kompatibilitas lagi
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'

    # Kita kunci ke Gradle 8.5 yang stabil dan mendukung penuh Java 21
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # Ekstrak folder kodingan kamu
    - name: Unzip Src Folder
      run: |
        if [ -f src.zip ]; then
          unzip -o src.zip
        fi

    # Rakit mod langsung menggunakan perintah sistem
    - name: Build Mod
      run: gradle build
