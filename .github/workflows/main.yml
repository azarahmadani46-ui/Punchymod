name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'

    - name: Setup Gradle 8.5 Wrapper
      run: |
        # Memaksa server membuat folder gradle versi baru yang cocok dengan Java 21
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        
    - name: Unzip Src Folder
      run: |
        # Membongkar src.zip jika ada di beranda
        if [ -f src.zip ]; then
          unzip -o src.zip
        fi
        
    - name: Build with Gradle
      run: ./gradlew build
