name: Check Java Code

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Memasang Java 16 agar sesuai dengan target Minecraft 1.16.5
    - name: Set up JDK 16
      uses: actions/setup-java@v4
      with:
        java-version: '16'
        distribution: 'adopt'

    # Membongkar kodingan mod dari HP kamu
    - name: Unzip Src Folder
      run: |
        if [ -f src.zip ]; then
          unzip -o src.zip
        fi

    # Mengecek apakah ada kode yang salah ketik (tanpa melibatkan Gradle)
    - name: Verify Code Syntax
      run: |
        echo "Memulai pemindaian kode mod..."
        if [ -d "src" ]; then
          find src -name "*.java" -exec javac -source 16 -target 16 {} + || echo "Ada kesalahan penulisan kode!"
        else
          echo "Folder src belum terdeteksi, pastikan src.zip sudah diunggah di beranda."
        fi
        echo "Pemeriksaan selesai!"
