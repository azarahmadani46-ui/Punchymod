name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 16
      uses: actions/setup-java@v4
      with:
        java-version: '16'
        distribution: 'adopt'

    - name: Setup Gradle 7.3 Wrapper
      run: |
        # Memakai Gradle 7.3 yang sangat stabil untuk Java 16 dan MC 1.16.5
        gradle wrapper --gradle-version 7.3
        chmod +x gradlew
        
    - name: Unzip Src Folder
      run: |
        if [ -f src.zip ]; then
          unzip -o src.zip
        fi
        
    - name: Build with Gradle
      run: ./gradlew build
