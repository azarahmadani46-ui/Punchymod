name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'

    - name: Setup Gradle Wrapper
      run: |
        # Menggenerasi ulang folder gradle yang hilang langsung di server
        gradle wrapper --gradle-version 7.6
        chmod +x gradlew
        
    - name: Unzip Src Folder
      run: |
        if [ -f src.zip ]; then
          unzip -o src.zip
        fi
        
    - name: Build with Gradle
      run: ./gradlew build
