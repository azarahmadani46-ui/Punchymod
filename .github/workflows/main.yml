name: Build Mod Jar Manual

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 16
      uses: actions/setup-java@v4
      with:
        java-version: '16'
        distribution: 'adopt'

    - name: Unzip Src Folder
      run: |
        if [ -f src.zip ]; then
          unzip -o src.zip
        fi

    # 1. Memeriksa ulang sintaks kode Java kamu (Bypass Gradle)
    - name: Verify Code Syntax
      run: |
        echo "Memeriksa kode mod..."
        if [ -d "src" ]; then
          find src -name "*.java" -exec javac -source 16 -target 16 {} +
        fi

    # 2. Membuat file .jar secara manual langsung dari folder proyekmu
    - name: Pack Mod Into Jar
      run: |
        echo "Membungkus file mod menjadi .jar..."
        mkdir -p build/libs
        # Mengompres kodingan dan aset menjadi file .jar matang
        zip -r build/libs/PunchyAnimation-Mod.jar fabric.mod.json assets/ data/ -x "src/*" "gradle*" ".git*" || true
        if [ -d "src/main/resources" ]; then
          cd src/main/resources && zip -r ../../../build/libs/PunchyAnimation-Mod.jar ./* && cd ../../../
        fi
        echo "Pembungkusan selesai!"

    # 3. Memunculkan tombol download file .jar di GitHub Actions!
    - name: Upload Built Jar
      uses: actions/upload-artifact@v4
      with:
        name: Fabric-Mod-Jar
        path: build/libs/*.jar
