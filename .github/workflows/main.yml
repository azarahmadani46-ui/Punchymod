name: Build Fabric Mod Jar

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 16
      uses: actions/setup-java@v4
      with:
        java-version: '16'
        distribution: 'adopt'

    - name: Setup Gradle 7.5.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5.1'

    - name: Unzip Src Folder
      run: |
        if [ -f src.zip ]; then
          unzip -o src.zip
        fi

    - name: Build Mod Jar File
      run: gradle build

    # Langkah tambahan untuk memunculkan tombol download file .jar jika sukses!
    - name: Upload Built Jar
      uses: actions/upload-artifact@v4
      with:
        name: Fabric-Mod-Jar
        path: build/libs/*.jar
